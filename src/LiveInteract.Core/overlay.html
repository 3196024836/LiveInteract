<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveInteract 透明展示</title><style>
:root{--accent:#71e1cc;--size:22px}*{box-sizing:border-box}body{margin:0;background:transparent;color:#f2f6f8;font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif}#root{position:fixed;left:32px;bottom:32px;width:460px;display:flex;flex-direction:column;gap:10px;font-size:var(--size)}.notice{padding:18px 22px;background:rgba(13,20,28,.9);border-left:4px solid var(--accent);border-radius:4px 12px 12px 4px;box-shadow:0 8px 30px #0003;animation:appear .25s ease-out}.notice.fail{border-color:#f1a88c}.eyebrow{color:var(--accent);font-size:.58em;letter-spacing:.16em;margin-bottom:8px}.title{font-weight:600;line-height:1.5}.detail{color:#bdcbd5;font-size:.72em;line-height:1.65;margin-top:5px}.effects{padding:14px 20px;border-radius:10px;background:rgba(13,20,28,.85);color:#d3e5ed;font-size:.68em;line-height:1.9}.progress{height:4px;background:#ffffff20;border-radius:5px;overflow:hidden;margin-top:8px}.progress i{height:100%;display:block;background:var(--accent)}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.notice{animation:none}}</style><div id="root"></div><script>
const root=document.getElementById('root');let state={},lastNotice='';function text(tag,content,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=content;return e}function render(){root.style.display=state.Enabled===false?'none':'flex';root.style.left=state.Corner?.includes('Right')?'auto':'32px';root.style.right=state.Corner?.includes('Right')?'32px':'auto';root.style.top=state.Corner?.includes('Top')?'32px':'auto';root.style.bottom=state.Corner?.includes('Top')?'auto':'32px';document.documentElement.style.setProperty('--size',(state.FontSize||22)+'px');if(/^#[0-9a-f]{6}$/i.test(state.Accent||''))document.documentElement.style.setProperty('--accent',state.Accent);root.replaceChildren();const n=state.Notice;if(n&&Date.now()-Date.parse(n.At)<(state.NoticeSeconds||6)*1000){const box=text('div','',n.Success===false?'notice fail':'notice');box.append(text('div',n.Simulation?'本地展示预览':'LIVE INTERACT','eyebrow'),text('div',n.Title||'','title'),text('div',n.Detail||'','detail'));root.append(box)}if(state.Effects?.length){const box=text('div','','effects');for(const e of state.Effects.slice(0,6))box.append(text('div',e));root.append(box)}for(const p of state.Progress||[]){const box=text('div','','effects');box.append(text('div',p.Name+'  '+p.Current+' / '+p.Threshold));const bar=text('div','','progress'),fill=document.createElement('i');fill.style.width=Math.max(0,Math.min(100,100*p.Current/p.Threshold))+'%';bar.append(fill);box.append(bar);root.append(box)}}new EventSource('/events').onmessage=e=>{try{state=JSON.parse(e.data);render()}catch{}};setInterval(render,500);
</script></html>
